# Render "Blueprint": deploys the JobMatch search server (the Python part). Pages (docs/) stay on GitHub Pages.
services:
  - type: web
    name: jobmatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.server:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /firebase-config.js
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JOBMATCH_ORIGINS
        value: https://tauhid1987.github.io
      - key: JOOBLE_KEY        # optional: your Jooble API key (adds Bangladesh jobs); set it in the Render dashboard
        sync: false
      # Approval emails. Free Render servers block SMTP ports, so use Brevo's web API (BREVO_API_KEY + MAIL_FROM).
      - key: BREVO_API_KEY
        sync: false
      # Approval emails by SMTP (only where the SMTP ports are open, e.g. a paid plan). Put the values in the Render dashboard, never in this file.
      # Gmail: smtp.gmail.com, port 587, and an App Password (Google account > Security > 2-Step Verification > App passwords).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM        # optional: defaults to SMTP_USER
        sync: false
      - key: SITE_URL
        value: https://tauhid1987.github.io/JobSeekerPortal/
